name: Uncensia
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.uncensia.native
    CODE_SIGN_STYLE: Automatic
targets:
  Uncensia:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Chat
      - Library
      - Studio
      - Settings
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Uncensia
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  UncensiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Uncensia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.uncensia.native.tests
  UncensiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Uncensia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.uncensia.native.uitests
schemes:
  Uncensia:
    build:
      targets:
        Uncensia: all
        UncensiaTests: [test]
        UncensiaUITests: [test]
    test:
      targets: [UncensiaTests, UncensiaUITests]
