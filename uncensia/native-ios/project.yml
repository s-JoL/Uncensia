name: Uncensia
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.uncensia.native
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
targets:
  Uncensia:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Chat
      - Library
      - Projects
      - Studio
      - Settings
      - Resources
    dependencies:
      - package: SwiftMath
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Uncensia
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  UncensiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Uncensia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.uncensia.native.tests
  UncensiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Uncensia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.uncensia.native.uitests
schemes:
  Uncensia:
    build:
      targets:
        Uncensia: all
        UncensiaTests: [test]
        UncensiaUITests: [test]
    test:
      targets: [UncensiaTests, UncensiaUITests]
      # Opt-in fixture gates expand from xcodebuild build settings, e.g.
      # `UNCENSIA_IOS_FIXTURE=1 bash scripts/native-ios.sh test`.
      environmentVariables:
        - variable: UNCENSIA_IOS_FIXTURE
          value: $(UNCENSIA_IOS_FIXTURE)
        - variable: UNCENSIA_STREAMING_FIXTURE
          value: $(UNCENSIA_STREAMING_FIXTURE)
        - variable: UNCENSIA_TASK_FIXTURE
          value: $(UNCENSIA_TASK_FIXTURE)
        - variable: UNCENSIA_PROJECT_FIXTURE
          value: $(UNCENSIA_PROJECT_FIXTURE)
        - variable: UNCENSIA_SCROLL_FIXTURE
          value: $(UNCENSIA_SCROLL_FIXTURE)
        - variable: UNCENSIA_DEVICE_COMPARISON
          value: $(UNCENSIA_DEVICE_COMPARISON)
        - variable: UNCENSIA_SERVER_URL
          value: $(UNCENSIA_SERVER_URL)
        - variable: UNCENSIA_ACCESS_CODE
          value: $(UNCENSIA_ACCESS_CODE)
        - variable: UNCENSIA_TEST_CONVERSATION_ID
          value: $(UNCENSIA_TEST_CONVERSATION_ID)
        - variable: UNCENSIA_TEST_MESSAGE_ID
          value: $(UNCENSIA_TEST_MESSAGE_ID)
